<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Boda - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <!-- LEFT SIDEBAR -->
        <div class="sidebar">
            <div class="shape shape-top-right"></div>
            <div class="shape shape-top-right-inner"></div>
            <div class="shape shape-bottom-left"></div>
            <div class="shape shape-bottom-curve"></div>

            <div class="sidebar-content">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-motorcycle"></i>
                    <span>BodaConnect</span>
                </a>
                <h1>Get Started <br>With Your <br><span>Fleet</span></h1>
                <p>Preparing the future of the Boda Boda industry.</p>
            </div>

            <div class="sidebar-footer">
                <span>Don't have an account?</span>
                <a href="signup.html">Sign Up <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>

        <!-- RIGHT FORM AREA -->
        <div class="form-area">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Log in to your account to continue</p>
            </div>

            <form action="dashboard.html">
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fa-regular fa-paper-plane"></i>
                        <input type="email" placeholder="Enter your Email Address" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Enter your Password" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Log in</button>
            </form>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-buttons">
                <button class="social-btn">
                    <i class="fa-brands fa-google"></i> Continue With Google
                </button>
            </div>

            <div class="bottom-link" style="margin-top: 30px;">
                Don't have account <a href="signup.html">Sign Up <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </div>
    </div>

</body>
</html>

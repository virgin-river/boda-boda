<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodaConnect - Register Rider</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- DASHBOARD SIDEBAR (Same as Dashboard) -->
        <div class="dash-sidebar">
            <a href="dashboard.html" class="logo">
                <i class="fa-solid fa-motorcycle"></i>
                <span>BodaConnect</span>
            </a>
            <ul class="dash-nav">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="register-rider.html" class="active"><i class="fa-solid fa-user-plus"></i> Register Rider</a></li>
                <li><a href="#"><i class="fa-solid fa-map-location-dot"></i> Live Tracking</a></li>
                <li><a href="#"><i class="fa-solid fa-wallet"></i> Earnings</a></li>
                <li style="margin-top: auto;"><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="dash-content">
            <div class="dash-header">
                <h2>Register New Rider</h2>
                <div class="user-profile">
                    <span>Admin User</span>
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=F9A826&color=fff" alt="User">
                </div>
            </div>

            <!-- REUSING THE FORM AREA STYLES FROM AUTH PAGES -->
            <div style="background: white; padding: 40px; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); max-width: 800px;">
                <form action="dashboard.html">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="input-group">
                            <label>Rider Full Name <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" placeholder="e.g. John Kamau" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Phone Number <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-phone"></i>
                                <input type="tel" placeholder="e.g. 0712345678" required>
                            </div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="input-group">
                            <label>Motorcycle Reg No. <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-id-card"></i>
                                <input type="text" placeholder="e.g. KMEA 123X" required>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>Assigned Stage <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-location-dot"></i>
                                <input type="text" placeholder="e.g. Westlands Stage" required>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>ID Number <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-address-card"></i>
                            <input type="text" placeholder="Enter National ID Number" required>
                        </div>
                    </div>

                    <div class="terms-group">
                        <input type="checkbox" required>
                        <span>I confirm that the rider has provided a valid Driving License and Motorcycle Insurance.</span>
                    </div>

                    <button type="submit" class="btn-primary" style="width: auto; padding: 16px 40px;">
                        Save Rider <i class="fa-solid fa-check"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
